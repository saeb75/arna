openapi: 3.0.3
info:
  title: GlotMate API
  version: 0.2.0
  description: |
    Praktika benzeri AI İngilizce öğretmeni — backend API'si.

    **Kimlik doğrulama:** Tüm `/v1` uçları Supabase Auth JWT'si ister
    (`Authorization: Bearer <access_token>`). Token, istemcide `@supabase/supabase-js`
    ile login sonrası `session.access_token`'dan alınır.

    **Faz durumu:** Tüm uçlar aktif — Onboarding, Müfredat (Faz 2), Ders (Faz 3),
    Oturum (Faz 4). Tipik akış: onboarding → curriculum/current → lessons/:id →
    lessons/:id/sessions → chat/tts/stt döngüsü → sessions/:id/end.
  contact:
    name: GlotMate
servers:
  - url: http://localhost:6560
    description: Yerel geliştirme
tags:
  - name: Sistem
    description: Sağlık ve operasyon uçları (auth istemez)
  - name: Onboarding
    description: Kayıt sonrası profil + kişisel program üretimi
  - name: Curriculum
    description: Kullanıcının aktif ders planı
  - name: Ders
    description: Tembel ders içeriği üretimi ("plan peşin, içerik tembel")
  - name: Oturum
    description: Ders çalışma zamanı — chat / TTS / STT / bitirme
  - name: Admin
    description: Admin paneli uçları — JWT `app_metadata.role = admin` ister (403 aksi hâlde)

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [Sistem]
      summary: Sağlık kontrolü
      security: []
      responses:
        "200":
          description: Servis ayakta
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  ts: { type: string, format: date-time }

  /v1/onboarding:
    post:
      tags: [Onboarding]
      summary: Profili kaydet ve müfredat görünümünü döndür
      description: |
        Kullanıcı profili yazılır (upsert) ve seçilen seviyenin **sabit** müfredatı
        ilerlemesiyle birlikte döner.

        **LLM çağrısı YOKTUR** — müfredat repo'daki katalogdan gelir, kullanıcıya
        özel plan üretilmez. Yanıt milisaniyeler sürer; istemcinin bekleme ekranı
        göstermesine gerek yoktur.

        **Rate limit:** kullanıcı başına saatte 5 istek.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OnboardingInput" }
      responses:
        "201":
          description: Profil kaydedildi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Curriculum" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /v1/curriculum/current:
    get:
      tags: [Curriculum]
      summary: Kullanıcının seviyesindeki sabit müfredatı ve ilerlemesini getir
      description: |
        Müfredat **sabittir ve tüm kullanıcılarda aynıdır** (repo'daki katalogdan
        seed edilir); bu uç onu kullanıcının ilerlemesiyle birleştirip ünitelere
        gruplu döndürür. Dersler **sıra zorunluluğu olmadan** açıktır.

        İlerleme tablosu seyrektir: satırı olmayan ders `not_started` sayılır, bu
        yüzden yeni kullanıcı 404 değil, tamamı `not_started` olan dolu bir liste alır.
        404 yalnızca **profil yok** (onboarding tamamlanmamış) demektir.
      responses:
        "200":
          description: Müfredat + ilerleme
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Curriculum" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Profil yok (önce onboarding gerekir)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: no_profile }

  /v1/me/profile:
    patch:
      tags: [Curriculum]
      summary: Seviye/track değiştir
      description: |
        Kullanıcı ayarlardan seviye veya track değiştirdiğinde çağrılır ve
        **yalnızca profili günceller**. İlerleme katalog kimliğine bağlı olduğu
        için hiç etkilenmez — eski `POST /v1/programs/regenerate` planı yeniden
        üretip ilerlemeyi arşive gömüyordu, o uç kaldırıldı.

        Gövdedeki iki alan da opsiyoneldir ama en az biri verilmelidir.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cefrLevel: { $ref: "#/components/schemas/CefrLevel" }
                track: { $ref: "#/components/schemas/Track" }
                tutorLanguage: { type: string, enum: [native, english] }
            example: { cefrLevel: B1 }
      responses:
        "200":
          description: Güncellenmiş müfredat görünümü
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Curriculum" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Profil bulunamadı (önce onboarding gerekir)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: no_profile }

  /v1/checkpoints/{level}/{unitIndex}:
    parameters:
      - { name: level, in: path, required: true, schema: { $ref: "#/components/schemas/CefrLevel" } }
      - { name: unitIndex, in: path, required: true, schema: { type: integer, minimum: 1, maximum: 99 } }
    get:
      tags: [Curriculum]
      summary: Ünite sonu testini derle
      description: |
        Ünitenin **yayınlı** çekirdeklerinden 8 madde derler (~3 mcq / 2 gap /
        3 order). Test SAKLANMAZ: her istekte yeniden örneklenir, yani tekrar
        denemede farklı sorular gelir. Ölçüm katmanı olduğu için LLM çağrısı
        YOKTUR — değerlendirme istemcide `gradeCheckpointItem` ile yapılır ve
        her maddenin tek doğru cevabı vardır.
      responses:
        "200":
          description: Derlenmiş test
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkpoint" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Profil ya da ünite yok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: unit_not_found }
        "409":
          description: Ünitenin dersleri henüz yayınlanmadı — test derlenemez
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: not_enough_items }
    post:
      tags: [Curriculum]
      summary: Test sonucunu kaydet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score, total]
              properties:
                score: { type: integer, minimum: 0 }
                total: { type: integer, minimum: 1 }
                weakLessonIds:
                  type: array
                  description: "Yanlış cevaplanan maddelerin geldiği dersler — tekrar önerisi için"
                  items: { type: string }
                  maxItems: 20
            example: { score: 6, total: 8, weakLessonIds: [a1-she-works-at-night] }
      responses:
        "200":
          description: Kaydedildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved: { type: boolean }
                  id: { type: string, format: uuid }
                  takenAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/admin/lessons:
    get:
      tags: [Admin]
      summary: Ders matrisi — katalog × (çekirdek · sahne seti · dil paketleri)
      description: |
        Aktif katalog satırlarının tamamı (fixture'lar hariç) ve her biri için
        GÜNCEL katman durumu: format + promptVersion (+ çekirdekte specHash)
        tutan satır. Eski sürüm satırları görünmez. `locales[].stale`, paketin
        sourceHash'inin güncel içerikle tutmadığını söyler (ilk açılışta yeniden
        üretilir). Filtre yok — 395 satır, istemci süzer.
      responses:
        "200":
          description: Matris
          content:
            application/json:
              schema:
                type: object
                required: [lessons, generatedAt]
                properties:
                  generatedAt: { type: string, format: date-time }
                  lessons:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: a1-she-works-at-night }
                        level: { type: string, enum: [A1, A2, B1, B2, C1, C2] }
                        unitIndex: { type: integer }
                        unitTitle: { type: string }
                        position: { type: integer }
                        kind: { type: string, enum: [phrases, grammar, practice] }
                        title: { type: string }
                        focus: { type: string }
                        targetPhrases: { type: array, items: { type: string } }
                        core: { $ref: "#/components/schemas/AdminLayer" }
                        sceneSet: { $ref: "#/components/schemas/AdminLayer" }
                        locales:
                          type: array
                          items:
                            type: object
                            properties:
                              language: { type: string, example: tr }
                              status: { $ref: "#/components/schemas/LayerStatus" }
                              stale: { type: boolean }
                              updatedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/lessons/{id}:
    get:
      tags: [Admin]
      summary: Ders detayı — katman içerikleri + lint raporları
      parameters: [{ $ref: "#/components/parameters/AdminLessonId" }]
      responses:
        "200": { $ref: "#/components/responses/AdminLessonDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Ders katalogda yok }

  /v1/admin/lessons/{id}/core/regenerate:
    post:
      tags: [Admin]
      summary: Çekirdeği LLM ile yeniden üret (force)
      description: |
        Hazır/yayınlı satır varken de üretir. Satır üretim boyunca düşürülmez; sonuç
        tek UPDATE ile `ready` yazılır → ders yayından çıkar, inceleme + `publish`
        gerekir. Bayat dil paketleri silinir. Senkron, 10–60 sn. Limit: 10/dk/kullanıcı.
      parameters: [{ $ref: "#/components/parameters/AdminLessonId" }]
      responses:
        "200": { $ref: "#/components/responses/AdminLessonDetail" }
        "409": { description: "Üretim başka süreçte sürüyor (`locale_in_progress`)" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { description: "Üretim/lint başarısız (`generation_failed`, `report` ile)" }

  /v1/admin/lessons/{id}/scenes/regenerate:
    post:
      tags: [Admin]
      summary: Sahne setini LLM ile yeniden üret (force)
      parameters: [{ $ref: "#/components/parameters/AdminLessonId" }]
      responses:
        "200": { $ref: "#/components/responses/AdminLessonDetail" }
        "409": { description: "Çekirdek yok (`layer_not_ready`) ya da üretim sürüyor" }
        "502": { description: Üretim/lint başarısız }

  /v1/admin/lessons/{id}/core/lint:
    post:
      tags: [Admin]
      summary: Elle düzenlenen çekirdeği doğrula (kuru koşu, yazmaz)
      description: Şema hatası 400 `invalid_input` + `issues`; pedagojik lint hatası 422 `lint_failed` + `report`. `practice.mustUse` katalogdan dayatılır.
      parameters: [{ $ref: "#/components/parameters/AdminLessonId" }]
      requestBody: { $ref: "#/components/requestBodies/AdminCoreBody" }
      responses:
        "200":
          description: Lint geçti
          content:
            application/json:
              schema:
                type: object
                properties: { report: { $ref: "#/components/schemas/LintReport" } }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "422": { description: "Lint hataları (`lint_failed`, `report`)" }

  /v1/admin/lessons/{id}/core:
    put:
      tags: [Admin]
      summary: Elle düzenlenen çekirdeği kaydet
      description: Lint kapısından geçerse satır `ready` + `model=authored/admin` yazılır (yayın ayrı adım); bayat dil paketleri silinir.
      parameters: [{ $ref: "#/components/parameters/AdminLessonId" }]
      requestBody: { $ref: "#/components/requestBodies/AdminCoreBody" }
      responses:
        "200": { $ref: "#/components/responses/AdminLessonDetail" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "422": { description: Lint hataları }

  /v1/admin/lessons/{id}/locales/{language}:
    post:
      tags: [Admin]
      summary: Dil paketi üret / yenile
      description: |
        Çekirdek ve sahne `ready|published` olmalı (aksi 409 `layer_not_ready`).
        `force=1` anahtarı tutan hazır paketi silip yeniden üretir. Başarıda aynı dilin
        bayat satırları temizlenir. Senkron. Limit: 30/dk/kullanıcı.
      parameters:
        - { $ref: "#/components/parameters/AdminLessonId" }
        - { name: language, in: path, required: true, schema: { type: string, example: tr } }
        - { name: force, in: query, required: false, schema: { type: string, enum: ["1"] } }
      responses:
        "200": { $ref: "#/components/responses/AdminLessonDetail" }
        "409": { description: "`layer_not_ready` · `locale_in_progress`" }
        "502": { description: "`locale_failed`" }

  /v1/admin/lessons/{id}/publish:
    post:
      tags: [Admin]
      summary: Çekirdek + sahne setini yayınla (ready → published)
      parameters: [{ $ref: "#/components/parameters/AdminLessonId" }]
      responses:
        "200": { $ref: "#/components/responses/AdminLessonDetail" }
        "409": { description: "Katman hazır değil (`layer_not_ready`)" }

  /v1/admin/settings/tts:
    get:
      tags: [Admin]
      summary: Tutor sesi ayarları — aktif sağlayıcı + ses/model
      description: |
        `app_settings.tts` satırı; hiç yazılmamışsa env varsayılanı (ElevenLabs,
        `updatedAt: null`). `configured` sağlayıcının API anahtarının .env'de
        olup olmadığını söyler — panel anahtarsız sağlayıcıyı seçtirmez.
        API anahtarları hiçbir cevapta yer almaz.
      responses:
        "200":
          description: Ayarlar
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TtsSettingsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [Admin]
      summary: Tutor sesi ayarlarını kaydet
      description: |
        Gövde ayarın TAMAMIDIR (kısmi güncelleme yok). Seçili sağlayıcının
        anahtarı .env'de yoksa, ses kimliği çözümlenemiyorsa (`voiceId: null`
        ve env varsayılanı da yoksa) ya da model listede değilse 400
        `provider_not_configured` — yazma olmaz. Başarıda süreç içi ayar
        önbelleği düşer; sonraki TTS çağrısı yeni sağlayıcıyla gider.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TtsSettings" }
      responses:
        "200":
          description: Güncel ayarlar (GET ile aynı biçim)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TtsSettingsResponse" }
        "400":
          description: Şema hatası veya seçili sağlayıcı yapılandırılmamış
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              examples:
                sema: { value: { error: invalid_input } }
                anahtar: { value: { error: provider_not_configured, message: "inworld anahtarı yok" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/settings/tts/preview:
    post:
      tags: [Admin]
      summary: Kaydetmeden dinle — seçilen sağlayıcı/ses/modelle kısa metin
      description: |
        Gerçek sağlayıcı çağrısı, ses önbelleği ATLANIR (operatör gerçek gecikmeyi
        duyar). `hasAlignment` zaman damgasının geldiğini söyler — dudak
        senkronunun bu sağlayıcıyla çalışacağının kanıtı.

        **Rate limit:** kullanıcı başına saatte 30.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, voiceId, modelId, text]
              properties:
                provider: { type: string, enum: [elevenlabs, inworld] }
                voiceId: { type: string }
                modelId: { type: string }
                text: { type: string, maxLength: 300 }
                language: { type: string, default: en, description: BCP-47 }
      responses:
        "200":
          description: Klip
          content:
            application/json:
              schema:
                type: object
                required: [audioBase64, latencyMs, hasAlignment]
                properties:
                  audioBase64: { type: string, description: mp3 bayt, base64 }
                  latencyMs: { type: integer }
                  hasAlignment: { type: boolean }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: Sağlayıcı hata verdi
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: tts_unavailable }

  /v1/admin/users:
    get:
      tags: [Admin]
      summary: Kullanıcı listesi (auth.users + profil + sayaçlar)
      description: |
        Kaynak `auth.users`; `hasProfile:false` onboarding'i bitirmemiş hesap.
        Sayaçlar: tamamlanan/başlanan ders, oturum sayısı + son oturum, toplam LLM
        maliyeti. Salt okunur; rol değişimi bu uçtan yapılmaz.
      responses:
        "200":
          description: Kullanıcılar
          content:
            application/json:
              schema:
                type: object
                properties:
                  generatedAt: { type: string, format: date-time }
                  users: { type: array, items: { $ref: "#/components/schemas/AdminUser" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/admin/users/{id}:
    get:
      tags: [Admin]
      summary: Kullanıcı detayı — profil, ilerleme, son 20 oturum (+özet), hafıza (son 30), ünite testleri, maliyet kırılımı
      description: Transkript turları ve `sessions.state` ASLA dönmez. Şema `@glotmate/contracts` `adminUserDetailSchema`.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Kullanıcı detayı }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: Kullanıcı yok }

  /v1/lessons/{catalogLessonId}:
    get:
      tags: [Ders]
      summary: Ders içeriğini getir (yoksa üret)
      description: |
        İçerik daha önce üretildiyse anında döner (~200 ms); üretilmediyse güçlü
        modelle üretilir (10–30 sn — istemci "Ders hazırlanıyor" göstermeli),
        şema + deterministik lint doğrulamasından geçer ve kaydedilir.
        İçerik PAYLAŞIMLIDIR: aynı katalog dersi + ana dil + track anahtarına düşen
        tüm kullanıcılar aynı satırı alır, ikinci kullanıcı üretim ödemez.
        Durum yalnızca oturum GERÇEKTEN açılınca `in_progress` olur.

        **Rate limit:** kullanıcı başına saatte 30 istek.
      parameters:
        - name: catalogLessonId
          in: path
          required: true
          description: Katalog satırının kalıcı slug'ı (UUID değil)
          schema:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
            example: a1-she-works-at-night
      responses:
        "200":
          description: Ders içeriği
          content:
            application/json:
              schema:
                type: object
                properties:
                  lessonId: { type: string, format: uuid }
                  lesson: { $ref: "#/components/schemas/LessonContent" }
                  warnings:
                    type: array
                    items: { type: string }
                    description: Lint uyarıları (engelleyici değil)
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Ders bulunamadı veya kullanıcıya ait değil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: not_found }
        "409":
          description: Üretim başka bir istekte sürüyor (kısa süre sonra tekrar dene)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: in_progress_elsewhere }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500":
          description: Üretim başarısız (yeniden denenebilir)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: generation_failed }

  /v1/lessons/{catalogLessonId}/sessions:
    post:
      tags: [Oturum]
      summary: Ders oturumu başlat
      description: |
        Ders için konuşma oturumu açar. Ders içeriği hazır (`ready`) olmalıdır —
        değilse 409 `lesson_not_ready` döner (önce `GET /v1/lessons/:id` çağır).

        Bu çağrı ayrıca **oturum script'ini üretir**: öğrencinin adı, hafızası ve
        geçen dersi kullanılarak hocanın söyleyeceği cümleler kurulur. Ders ancak
        burada `in_progress` olur — içeriği getirmek veya ön-üretmek durumu değiştirmez.

        **Rate limit:** kullanıcı başına saatte 20.
      parameters:
        - name: catalogLessonId
          in: path
          required: true
          description: Katalog satırının kalıcı slug'ı (UUID değil)
          schema:
            type: string
            pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
            example: a1-she-works-at-night
      responses:
        "201":
          description: |
            Oturum açıldı. Yanıt, hocanın bu oturumda söyleyeceği cümleleri (`script`)
            de taşır — bu üretim birkaç saniye sürebilir.
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessionId: { type: string, format: uuid }
                  script:
                    allOf: [{ $ref: "#/components/schemas/SessionScript" }]
                    nullable: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Ders bulunamadı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Ders içeriği henüz üretilmemiş
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: lesson_not_ready }

  /v1/sessions/{sessionId}/chat:
    post:
      tags: [Oturum]
      summary: Öğretmenle konuşma turu
      description: |
        Kullanıcı mesajını alır. Emma'nın sistem prompt'u **sunucuda** montajlanır —
        istemciye asla gitmez. Her tur transkripte yazılır.

        **Bağlam yalıtımı:** `lecture` fazında geçmiş HİÇ gönderilmez (gereken her şey
        o anki beat bağlamındadır); `practice` ve `wrapup` yalnızca KENDİ fazlarının
        turlarını görür. Aksi hâlde model roleplay ortasında eski alıştırmalara
        dönüyordu.

        **Akış kararı istemcide/kodda verilir, bu ucun METNİNE bakılmaz.** Sunucu
        yalnızca yapısal bayrak döndürür (`segmentDone`, `beatDone`).

        **Rate limit:** kullanıcı başına saatte 120.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 1000, example: "I am a developer." }
                phase:
                  type: string
                  enum: [lecture, practice, wrapup]
                  default: lecture
                  description: |
                    `lecture` beat bağlamı · `practice` roleplay (hoca karakterde) ·
                    `wrapup` kapanış (hoca karakterden ÇIKAR, ders bu fazda sayaçla bitmez).
                beatId: { type: string, maxLength: 40, description: Lecture fazında aktif beat, example: b3 }
                turnIndex: { type: integer, minimum: 0, maximum: 20, description: Practice fazında kaçıncı tur }
                attempt: { type: integer, minimum: 0, maximum: 5, description: Alıştırmada kaçıncı deneme }
                lastExchange:
                  type: boolean
                  description: |
                    Soru penceresinin izin verilen SON turu. İstemci sayaçtan hesaplar;
                    hoca "başka sorun var mı?" demek yerine kapanış yapar, böylece
                    akış ilerlerken hocayla çelişmez.
      responses:
        "200":
          description: Emma'nın yanıtı
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string, example: "Nice to meet you! What do you develop?" }
                  segmentDone:
                    type: boolean
                    description: |
                      Yalnızca `practice`: sahne bitti. İki deterministik nedenden biri —
                      tur tavanı doldu ya da öğrenci hedef kalıbı `minTargetUses` kez
                      üretti (en erken 4. turda). Modelin cevabına BAKILMAZ.
                      İstemci bunu görünce dersi bitirmez, **kapanış fazına** geçer.
                    example: false
                  beatDone:
                    type: boolean
                    description: |
                      Adım tamamlandı (yapısal karar). `open_response`: rubrik cevabı kabul
                      etti ya da deneme hakkı bitti. `exercise`: deterministik eşleyicinin
                      ıskaladığı cevabı judge kabul etti (yazım sürçmesi, kabul listesinde
                      olmayan geçerli varyant, "the first one" gibi paraphrase) — LLM
                      emniyet ağı; hak yakılmadan ilerlenir.
                    example: false
                  isAttempt:
                    type: boolean
                    description: |
                      Alıştırma / açık uçlu adımda: öğrencinin sözü bir CEVAP DENEMESİ miydi?
                      `false` ise (selamlama, konu dışı laf) deneme hakkı YANMAZ; hoca konudan
                      kopmadan soruyu yeniden sorar. "Bilmiyorum" denemedir — sunucuda
                      deterministik belirlenir, modele bırakılmaz.
                    example: true
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Oturum bulunamadı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Oturum kapatılmış
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
              example: { error: session_ended }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/sessions/{sessionId}/tts:
    post:
      tags: [Oturum]
      summary: Dil etiketli parçaları sese çevir (klip listesi)
      description: |
        v7: gövde dil etiketli parçalar (`runs`) alır; ardışık aynı-dil parçalar
        tek klipte birleştirilir, her klip KENDİ `language_code`uyla üretilir
        (native modda ana dil + İngilizce karışık konuşma doğru telaffuzla çıkar).
        İstemci klipleri sırayla çalar; `onEnd` son klipten sonra TAM BİR KEZ.
        Ana dil aktif sağlayıcının kapsamı dışındaysa (ElevenLabs ~32 dil; Inworld
        200+) o parçalar sessiz kalır (metin ekranda), yalnız İngilizce klipler döner.
        Eski `{text}` gövdesi tek İngilizce parça sayılır. Toplam ≤4000 karakter
        (en fazla 48 parça); her klip 600 karakterde kesilir.

        Sağlayıcı (ElevenLabs / Inworld) ve ses/model `app_settings.tts`'ten gelir
        (admin panel, `PUT /v1/admin/settings/tts`). Cevap biçimi sağlayıcıdan
        bağımsızdır: mp3 base64 + KARAKTER bazlı zaman damgası (ElevenLabs biçimi;
        Inworld sunucuda çevrilir). Seçili sağlayıcı yapılandırılmamış veya hata
        veriyorsa otomatik geçiş YOK → 502 `tts_unavailable`.

        **Rate limit:** kullanıcı başına saatte 120.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                runs:
                  type: array
                  items:
                    type: object
                    required: [lang, text]
                    properties:
                      lang: { type: string, enum: [en, l1] }
                      text: { type: string }
                text: { type: string, description: "Eski biçim — tek İngilizce parça sayılır" }
      responses:
        "200":
          description: Klip listesi (sırayla çalınır)
          content:
            application/json:
              schema:
                type: object
                properties:
                  clips:
                    type: array
                    items:
                      type: object
                      properties:
                        audioBase64: { type: string, description: mp3 bayt, base64 }
                        alignment:
                          type: object
                          nullable: true
                          description: Karakter bazlı zaman damgası (saniye, klip başına 0'dan). Sağlayıcı vermezse null — istemci düz çeneye düşer.
                          properties:
                            characters: { type: array, items: { type: string } }
                            character_start_times_seconds: { type: array, items: { type: number } }
                            character_end_times_seconds: { type: array, items: { type: number } }
                        lang: { type: string, description: Klibin sağlayıcı dil kodu }

  /v1/sessions/{sessionId}/stt:
    post:
      tags: [Oturum]
      summary: Sesi metne çevir
      description: |
        Kullanıcı ses kaydını transkribe eder (multipart `file`, ≤10 MB;
        webm/mp4/mp3/wav/ogg — iOS Safari'nin mp4 çıktısı desteklenir).
        1 KB altı kayıtlar `audio_too_short` ile reddedilir.

        **Rate limit:** kullanıcı başına saatte 120.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          description: Transkript
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }

  /v1/sessions/{sessionId}/end:
    post:
      tags: [Oturum]
      summary: Oturumu bitir
      description: |
        İdempotent — iki kez çağrılabilir; ders satırı `completed` işaretlenir.
        Faz 6'dan itibaren memory çıkarım işini de tetikleyecek.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Oturum kapatıldı
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  turns: { type: integer, description: Oturumdaki toplam transkript turu, example: 14 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Oturum bulunamadı
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token'ı

  responses:
    Unauthorized:
      description: Token yok veya geçersiz
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          examples:
            eksik: { value: { error: missing_token } }
            gecersiz: { value: { error: invalid_token } }
    Forbidden:
      description: Token geçerli ama admin rolü yok
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { error: forbidden }
    AdminLessonDetail:
      description: Ders detayı (katalog + çekirdek + sahne seti + dil paketleri). Şema `@glotmate/contracts` `adminLessonDetailSchema`.
      content:
        application/json:
          schema:
            type: object
            required: [lesson, catalog, core, sceneSet, locales]
            properties:
              lesson: { type: object, description: Matristeki satırla aynı }
              catalog:
                type: object
                properties: { themeHint: { type: string }, specHash: { type: string } }
              core:
                nullable: true
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: "#/components/schemas/LayerStatus" }
                  updatedAt: { type: string, format: date-time }
                  model: { type: string, nullable: true }
                  core: { type: object, nullable: true, description: LessonCore JSON }
                  report: { $ref: "#/components/schemas/LintReport" }
              sceneSet:
                nullable: true
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { $ref: "#/components/schemas/LayerStatus" }
                  updatedAt: { type: string, format: date-time }
                  model: { type: string, nullable: true }
                  scenes: { type: object, nullable: true, description: "track → SceneVariant" }
                  report: { $ref: "#/components/schemas/LintReport" }
              locales:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    language: { type: string }
                    status: { $ref: "#/components/schemas/LayerStatus" }
                    stale: { type: boolean }
                    updatedAt: { type: string, format: date-time }
                    model: { type: string, nullable: true }
                    report: { $ref: "#/components/schemas/LintReport" }

  parameters:
    AdminLessonId:
      name: id
      in: path
      required: true
      description: Katalog satırının kalıcı slug'ı
      schema: { type: string, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$", example: a1-she-works-at-night }

  requestBodies:
    AdminCoreBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [core]
            properties:
              core: { type: object, description: "LessonCore (contracts `lessonCoreSchema`)" }
    InvalidInput:
      description: Gövde şema doğrulamasından geçemedi
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Error"
              - type: object
                properties:
                  issues:
                    type: array
                    items: { type: object }
          example: { error: invalid_input, issues: [] }
    RateLimited:
      description: Rate limit aşıldı
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Beklenmeyen hata (LLM çıktısı 2 denemede doğrulanamaması dahil)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    TtsProviderConfig:
      type: object
      required: [voiceId, modelId]
      properties:
        voiceId: { type: string, nullable: true, description: "null = .env varsayılanı" }
        modelId: { type: string }
    TtsSettings:
      type: object
      required: [provider, elevenlabs, inworld]
      properties:
        provider: { type: string, enum: [elevenlabs, inworld] }
        elevenlabs: { $ref: "#/components/schemas/TtsProviderConfig" }
        inworld: { $ref: "#/components/schemas/TtsProviderConfig" }
    TtsSettingsResponse:
      type: object
      required: [settings, configured, defaultVoiceId, models, updatedAt]
      properties:
        settings: { $ref: "#/components/schemas/TtsSettings" }
        configured:
          type: object
          properties: { elevenlabs: { type: boolean }, inworld: { type: boolean } }
        defaultVoiceId:
          type: object
          properties: { elevenlabs: { type: string, nullable: true }, inworld: { type: string, nullable: true } }
        models:
          type: object
          properties:
            elevenlabs: { type: array, items: { type: string } }
            inworld: { type: array, items: { type: string } }
        updatedAt: { type: string, format: date-time, nullable: true }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: Makine-okunur hata kodu }

    LayerStatus:
      type: string
      enum: [generating, ready, failed, published, retired]

    AdminUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, nullable: true }
        isAdmin: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastSignInAt: { type: string, format: date-time, nullable: true }
        hasProfile: { type: boolean }
        displayName: { type: string, nullable: true }
        nativeLanguage: { type: string, nullable: true, example: tr }
        cefrLevel: { type: string, nullable: true, enum: [A1, A2, B1, B2, C1, C2, null] }
        track: { type: string, nullable: true }
        tutorLanguage: { type: string, nullable: true }
        lessonsCompleted: { type: integer }
        lessonsInProgress: { type: integer }
        sessionCount: { type: integer }
        lastSessionAt: { type: string, format: date-time, nullable: true }
        llmCostUsd: { type: number }

    LintReport:
      type: object
      nullable: true
      properties:
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }

    AdminLayer:
      type: object
      nullable: true
      description: Çekirdek/sahne seti satır özeti; null = bu katalog sürümü için üretilmemiş
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/LayerStatus" }
        updatedAt: { type: string, format: date-time }

    Checkpoint:
      type: object
      description: |
        Ünite sonu testi. `labels` yönergeleri chrome'dan ana dilde gelir; madde
        metinleri İngilizcedir (ölçülen malzeme). Her madde tek doğru cevaplıdır.
      required: [level, unitIndex, unitTitle, unitGoal, labels, items]
      properties:
        level: { $ref: "#/components/schemas/CefrLevel" }
        unitIndex: { type: integer }
        unitTitle: { type: string }
        unitGoal: { type: string }
        labels:
          type: object
          description: "Madde tipi yönergeleri, ana dilde"
          required: [mcq, gap, order]
          properties:
            mcq: { type: string }
            gap: { type: string }
            order: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/CheckpointItem" }

    CheckpointItem:
      oneOf:
        - type: object
          description: "Çoktan seçmeli — doğru cümleyi/cevabı seç"
          required: [kind, id, lessonId, prompt, options, correctIndex]
          properties:
            kind: { type: string, enum: [mcq] }
            id: { type: string }
            lessonId: { type: string, description: "Yanlışta tekrar önerilecek ders" }
            prompt: { type: string }
            options: { type: array, items: { type: string } }
            correctIndex: { type: integer }
            optionFeedback:
              type: array
              description: "Dil paketinden şık açıklamaları (ana dilde, opsiyonel)"
              items: { type: string }
        - type: object
          description: |
            Boşluk doldurma — **kelime bankasıyla**. Serbest yazım yoktur;
            çeldiriciler aynı ünitenin diğer derslerinin cevaplarından gelir ve
            harf deseni doğruyla eşleşir (büyük harf ipucu vermez).
          required: [kind, id, lessonId, prompt, options, correctIndex]
          properties:
            kind: { type: string, enum: [gap] }
            id: { type: string }
            lessonId: { type: string }
            prompt: { type: string }
            options: { type: array, items: { type: string } }
            correctIndex: { type: integer }
        - type: object
          description: |
            Cümle sıralama — 4-9 kelimelik **tek** cümle (iki cümle kutucuklara
            bölününce tek doğru cevap kalmaz). `tokens` karıştırılmış dizidir.
          required: [kind, id, lessonId, tokens, answer]
          properties:
            kind: { type: string, enum: [order] }
            id: { type: string }
            lessonId: { type: string }
            tokens: { type: array, items: { type: string } }
            answer: { type: array, items: { type: string } }
      discriminator: { propertyName: kind }

    CefrLevel:
      type: string
      enum: [A1, A2, B1, B2, C1, C2]
      description: CEFR seviyesi (onboarding'de select box ile kullanıcı seçer)

    Track:
      type: string
      enum: [business, conversation, exam]
      description: Öğrenme hedefi

    Interest:
      type: string
      enum:
        [technology, business, travel, movies_tv, music, sports, gaming, food,
         science, health, finance, art_design, fashion, education, news_politics, nature]

    OnboardingInput:
      type: object
      required: [displayName, dailyGoalMinutes, track, interests, cefrLevel]
      properties:
        displayName: { type: string, maxLength: 60, example: Saeb }
        dailyGoalMinutes:
          type: integer
          enum: [5, 10, 15]
          description: Günlük hedef (streak çıtası)
        track: { $ref: "#/components/schemas/Track" }
        interests:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: "#/components/schemas/Interest" }
        occupation:
          type: string
          maxLength: 120
          description: |
            Serbest metin. Paylaşımlı ders içeriğine GİRMEZ (sızıntı olurdu);
            yalnızca canlı sohbette hocanın bağlamına eklenir.
          example: front-end developer / takım lideri
        cefrLevel: { $ref: "#/components/schemas/CefrLevel" }
        tutorLanguage:
          type: string
          enum: [native, english]
          default: native
          description: |
            Öğretim dili. `native`: Emma açıklamaları öğrencinin dilinde yapar
            (öğretilen İngilizce malzeme ve rol yapma İngilizce kalır).

    CurriculumLesson:
      type: object
      description: |
        Katalog satırı — dersin İÇERİĞİ değil, tanımı. Müfredat ÜNİTELERDEN oluşur;
        her derste bir tip: `phrases` (işlevsel kalıp seti) · `grammar` (tek bir yapı)
        · `practice` (yalnızca konuşturur). Katalog lint'i 4'ten fazla ardışık
        `grammar` dersine izin vermez.
      properties:
        id:
          type: string
          description: Kalıcı slug — UUID DEĞİL. İlerleme ve içerik önbelleği buna bağlıdır.
          example: a1-she-works-at-night
        position: { type: integer, example: 22 }
        unitIndex: { type: integer, example: 4 }
        kind:
          type: string
          enum: [phrases, grammar, practice]
        title:
          type: string
          description: |
            KANONİK İNGİLİZCE. Katalog tek bir ana dile çivilenmemeli; ayrıca
            başlığın kendisi de öğrenme malzemesidir. Öğrenciye görünen ana-dil
            metni üretilen `LessonContent`ten gelir.
          example: She Works at Night
        focus:
          type: string
          description: Öğretilen tek şey, İngilizce
          example: "present simple: third person -s"
        status:
          type: string
          enum: [not_started, in_progress, completed]
          description: İlerleme satırı yoksa `not_started`

    CurriculumUnit:
      type: object
      properties:
        index: { type: integer, example: 4 }
        title: { type: string, example: Everyday Life }
        goal:
          type: string
          description: Ünite sonunda öğrencinin yapabilecek olduğu şey (can-do)
          example: Describe your daily routine and say when you do things
        lessons:
          type: array
          items: { $ref: "#/components/schemas/CurriculumLesson" }

    Curriculum:
      type: object
      properties:
        level: { $ref: "#/components/schemas/CefrLevel" }
        label:
          type: string
          description: Basamağın görünen adı
          example: Beginner
        track: { $ref: "#/components/schemas/Track" }
        units:
          type: array
          items: { $ref: "#/components/schemas/CurriculumUnit" }
        totals:
          type: object
          properties:
            lessons: { type: integer, example: 46 }
            completed: { type: integer, example: 3 }

    LessonContent:
      type: object
      description: |
        Birleşik ders görünümü — **v7** (`formatVersion: 7`). Sunucu üç katmanı
        (İngilizce çekirdek + track sahnesi + dil paketi) chrome ile birleştirir;
        istemci tek nesne görür. Metin alanları DİL ETİKETLİ PARÇALARDIR
        (`runs: [{lang: en|l1, text, emphasis?}]`): ekran `en`i vurgular, TTS her
        parçayı kendi diliyle okur. `ui` alanı ACK/pes kümelerini ve etiketleri
        taşır — istemci dil sinyallerini hardcode etmez.

        İçerikte kullanıcıya özel hiçbir veri YOKTUR. Akış kontrolü içerikte değil,
        SUNUCU KODUNDA ve @glotmate/contracts saf fonksiyonlarındadır. Tam şema:
        packages/contracts/src/lessonLayers.ts → lessonContentV7Schema.

        İki faz: LECTURE (beats) → PRACTICE (roleplay). Tam şema
        `packages/contracts` içindedir (tek doğruluk kaynağı).
      properties:
        formatVersion: { type: integer, enum: [6] }
        title: { type: string, description: "Öğrencinin ana dilinde" }
        topic: { type: string, description: "Kısa İngilizce konu adı" }
        focus: { type: string, description: "Öğretilen tek şey (İngilizce)" }
        theme: { type: string, description: "Bağlam — ana dilde" }
        objectives:
          type: array
          description: "2-3 ölçülebilir can-do hedefi (İngilizce)"
          items: { type: string }
        communicationGoal: { type: string }
        estMinutes: { type: integer, example: 6 }
        tutorNotes:
          type: object
          description: "Derse ÖZEL pedagoji notları (global politika tutorPrompt'ta)"
          properties:
            target: { type: string }
            commonErrors: { type: array, items: { type: string } }
            correction: { type: string }
        lecture:
          type: object
          properties:
            beats:
              type: array
              items:
                type: object
                required: [id, kind]
                description: |
                  Ayrımcı `kind` alanlı birleşim:
                  - `ask` — hoca konuşur ve CEVAP BEKLER; `purpose: readiness|questions`, `intent`
                  - `say` — hoca konuşur, akış kendiliğinden ilerler; `intent`
                  - `teach` — `introIntent` + ekranda gösterilen `points[]` (authored)
                  - `exercise` — `prompt`, `options?`, `answers[]`, `hint` (hepsi authored)
                properties:
                  id: { type: string }
                  kind: { type: string, enum: [say, ask, teach, exercise] }
                additionalProperties: true
        practice:
          type: object
          properties:
            introIntent: { type: string }
            persona:
              type: object
              properties:
                name: { type: string }
                role: { type: string }
                mood: { type: string }
                goal: { type: string, description: "Karakterin sahnedeki amacı" }
            scenario: { type: string }
            userGoal: { type: string }
            avatarOpening: { type: string }
            mustUse: { type: array, items: { type: string } }
            minTargetUses:
              type: integer
              description: "Hedef yapı kaç turda üretilirse sahne başarılı sayılır (sunucuda deterministik sayılır)"
            successCriteria: { type: string }
            maxTurns: { type: integer }
        summary: { type: string, description: "Ana dilde kapanış özeti" }
        quiz:
          type: array
          description: "Ders sonrası İSTEĞE BAĞLI mini test (3-5 soru)"
          items: { type: object, additionalProperties: true }

    SessionScript:
      type: object
      description: |
        Hocanın BU oturumda söyleyeceği cümleler. Oturum açılışında bir kez üretilir
        (öğrencinin adı + hafızası + geçen dersi ile) ve `sessions.state`'e yazılır.
        Ders içeriğinden ayrıdır: içerik kullanıcıdan bağımsızdır, script kişiseldir.

        Üretim başarısız olursa sunucu deterministik bir yedek script döner — ders
        asla bu yüzden bloke olmaz.
      properties:
        v: { type: integer, enum: [1] }
        beats:
          type: object
          description: "beatId → hocanın o beat'te söyleyeceği cümle (say/ask/teach girişi)"
          additionalProperties: { type: string }
        practiceIntro: { type: string }
        inviteQuestion:
          type: string
          description: "Öğrenci 'sorum var' deyince söylenen davet — soruyla biter"
        wrapup:
          type: string
          description: |
            Kapanış: hoca rol karakterinden çıkıp dersi bitirir, tek cümlelik özet +
            "sormak istediğin bir şey var mı?". Soruyla biter.
        farewell:
          type: string
          description: "Öğrenci 'hayır' deyince söylenen veda — soru içermez, ders yine bitmez"
        praise:
          type: array
          description: "Doğru cevaplarda sırayla kullanılan kısa övgüler (LLM çağrısı yapılmaz)"
          items: { type: string }
